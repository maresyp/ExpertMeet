version: "3.9"
name: expertmeet

services:
  frontend-web-server:
    container_name: expertmeet-frontend-web-server
    build:
      src/frontend/web
    ports:
      - 80:80
    depends_on:
      - expertmeet-nginx-server
      - notifications-server
      - conversations-server

  expertmeet-nginx-server:
    env_file:
      - .env
    container_name: expertmeet-nginx-server
    build:
      src/backend/expertmeet/nginx
    ports:
      - 8080:8080
    depends_on:
      - expertmeet-django-server

  expertmeet-django-server:
    env_file:
      - .env
    container_name: expertmeet-django-server
    expose:
      - 8000
    build:
      src/backend/expertmeet
    depends_on:
      - expertmeet-db-postgres

  expertmeet-db-postgres:
    container_name: expertmeet-web-db
    image: postgres
    user: postgres
    restart: "on-failure"
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_PORT=5432
    ports: # TODO : hide this port after testing is done
      - 5432:5432
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications-server:
      container_name: expertmeet-notifications-server
      env_file:
      - .env
      expose:
        - 8080
      build:
        src/backend/notifications
      depends_on:
        - db-postgres-notifications

  notifications-celery:
    container_name: expertmeet-notifications-celery
    env_file:
      - .env
    build:
      context: src/backend/notifications
      dockerfile: DockerfileCelery
    depends_on:
      - notifications-server
      - message-broker

  db-postgres-notifications:
    container_name: expertmeet-notifications-db
    image: postgres
    user: postgres
    restart: "on-failure"
    volumes:
      - db-notifications:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_PORT=5432
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  conversations-server:
        container_name: expertmeet-conversations-server
        env_file:
        - .env
        expose:
          - 8080
        build:
          src/backend/conversations
        depends_on:
          - db-postgres-conversations

  db-postgres-conversations:
    container_name: expertmeet-conversations-db
    image: postgres
    user: postgres
    restart: "on-failure"
    volumes:
      - db-conversations:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_PORT=5432
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  message-broker:
    container_name: expertmeet-broker
    image: rabbitmq
    expose:
      - 5672

volumes:
  db-data:
    driver: local
  db-notifications:
    driver: local
  db-conversations:
    driver: local