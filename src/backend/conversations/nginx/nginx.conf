upstream conversations-django-server {
    server conversations-django-server:8000;
}

server {

    listen 8082;

    location / {
        proxy_pass http://conversations-django-server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static {
        autoindex on;
        alias /staticfiles;
    }

}